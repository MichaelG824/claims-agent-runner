# Practice Postgres on 5433 so it never collides with the real interview repo on 5432.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: runner
      POSTGRES_PASSWORD: runner
      POSTGRES_DB: runner
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runner"]
      interval: 2s
      timeout: 2s
      retries: 15
